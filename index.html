<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15101c">
<title>Michael Chapman</title>
<meta name="description" content="Four things to play with: TimeCat, Top Banana, The King's Line and Brasshaven.">
<link rel="canonical" href="https://michaelchapman.me/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=IM+Fell+English+SC&family=Lilita+One&family=Press+Start+2P&family=Archivo:wght@500;700;800&display=swap">
<style>
/* Layout: a games-shop shelf. Four boxed-game covers stand on one wooden shelf, each a link;
   the name and a line about it sit underneath. Single deliberate look, dark in any theme. */
:root {
  --wall: #15101c;
  --wall2: #231a2e;
  --ink: #f3ece0;
  --muted: #b5a9bd;
  --shelf: #6b4423;
  --shelf-hi: #9a6a3c;
  --shelf-lo: #3d2614;
  --focus: #ffd23f;
}
* { box-sizing: border-box; }
html { background: var(--wall); }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: "Archivo", system-ui, sans-serif;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, #3a2b4a 0%, transparent 70%),
    repeating-linear-gradient(90deg, transparent 0 46px, rgba(255,255,255,.025) 46px 48px),
    linear-gradient(var(--wall2), var(--wall));
  padding: max(24px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; justify-content: center;
}
.shelf {
  width: 100%;
  list-style: none;
  margin: 0 auto;
  padding: 0;
  max-width: 1100px;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 56px 32px;
}
.shelf li { position: relative; padding-bottom: 6px; }
.stage::after {
  /* the plank each box stands on */
  content: "";
  position: absolute;
  left: -18px; right: -18px; bottom: -16px;
  height: 18px;
  background: linear-gradient(var(--shelf-hi) 0 3px, var(--shelf) 3px 13px, var(--shelf-lo) 13px);
  box-shadow: 0 10px 18px rgba(0,0,0,.5);
  z-index: -1;
}
.shelf a {
  display: block;
  color: inherit;
  text-decoration: none;
  outline: none;
}
.stage { perspective: 900px; position: relative; z-index: 1; }
.box {
  position: relative;
  aspect-ratio: 3 / 4;
  transform-style: preserve-3d;
  transform: rotateY(22deg);
  transform-origin: 50% 100%;
  transition: transform .45s cubic-bezier(.2,.8,.2,1);
}
.face, .spine { position: absolute; top: 0; height: 100%; backface-visibility: hidden; }
.face {
  left: 0; width: 100%;
  border-radius: 2px;
  overflow: hidden;
  box-shadow: 0 0 0 1px rgba(0,0,0,.4);
}
.face svg { display: block; width: 100%; height: 100%; }
/* glossy shrink-wrap sheen across the front */
.face::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(115deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 62%, rgba(255,255,255,.12) 75%, rgba(255,255,255,0) 90%);
  pointer-events: none;
}
.spine {
  left: 0; width: 15%;
  transform-origin: 0 50%;
  transform: rotateY(-90deg);
  display: flex; align-items: center; justify-content: center;
  writing-mode: vertical-rl;
  font-weight: 800; font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
  background: var(--spine);
  color: var(--spine-ink);
  filter: brightness(.7);
  white-space: nowrap; overflow: hidden;
}
.shadow {
  position: absolute; left: 6%; right: 0; bottom: -6px; height: 14px;
  background: radial-gradient(closest-side, rgba(0,0,0,.6), transparent);
  z-index: -1;
}
.shelf a:hover .box, .shelf a:focus-visible .box { transform: rotateY(4deg) translateY(-8px); }
.shelf a:focus-visible .face { box-shadow: 0 0 0 3px var(--focus); }
.cap { position: relative; z-index: 1; margin-top: 30px; text-align: center; }
.cap b { display: block; font-size: 18px; font-weight: 800; }
.cap span { display: block; margin-top: 4px; color: var(--muted); font-size: 14px; line-height: 1.4; }
.shelf a:hover .cap b, .shelf a:focus-visible .cap b { color: var(--focus); }

@media (max-width: 860px) {
  .shelf { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 44px 28px; }
}
@media (max-width: 380px) {
  .shelf { gap: 40px 20px; }
  .cap span { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  .box { transition: none; }
}

/* ---- cover art: shared bits ---- */
.cd-strip { fill: #0b0b0e; }
.cd-text { font: italic 900 15px "Archivo", sans-serif; fill: #fff; letter-spacing: .02em; }
.cd-small { font: 700 8.5px "Archivo", sans-serif; fill: #cfc8d6; letter-spacing: .12em; }
.disc { fill: url(#cd-sheen); stroke: #9aa3b5; stroke-width: 1; }
.age { fill: #fff; }
.age-t { font: 900 14px "Archivo", sans-serif; fill: #0b0b0e; }
.age-s { font: 700 6px "Archivo", sans-serif; fill: #0b0b0e; letter-spacing: .08em; }

/* TimeCat */
.tc-rays polygon { fill: #3d1d6e; }
.tc-face { fill: #f2d9a0; }
.tc-ticks line { stroke: #2b1d16; stroke-linecap: round; }
.tc-title { font: 30px "Press Start 2P", monospace; letter-spacing: 1px; }
.tc-tag { font: 8px "Press Start 2P", monospace; fill: #7fd4ff; }
.tc-burst { fill: #ff4d6d; }
.tc-burst-t { font: 900 13px "Archivo", sans-serif; fill: #fff; }

/* Top Banana */
.tb-rays polygon { fill: #ffe27a; }
.tb-title { font: 46px "Lilita One", sans-serif; }
.tb-leaf { fill: #1d6b3d; }
.tb-leaf2 { fill: #2e8b4e; }

/* King's Line */
.kl-title { font: 900 25px "Cinzel Decorative", serif; }
.kl-sub { font: 700 9px "Archivo", sans-serif; fill: #e9cf86; letter-spacing: .32em; }
.kl-node { fill: #12183a; stroke: #e9cf86; stroke-width: 2.5; }
.kl-line { fill: none; stroke: #e9cf86; stroke-width: 2.5; }

/* Brasshaven */
.bh-rays polygon { fill: #ffd89a; opacity: .35; }
.bh-gear polygon { fill: #8a5a22; opacity: .55; }
.bh-gear .gh { fill: #c9714a; opacity: .55; }
.bh-title { font: 37px "IM Fell English SC", serif; letter-spacing: 1px; }
.bh-sub { font: italic 700 11px "Archivo", sans-serif; fill: #2a1610; }
</style>
</head>
