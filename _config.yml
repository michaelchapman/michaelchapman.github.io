# Site settings. The site is the Long Gallery: one room of a castle library
# (see README.md). Layouts are the site's own, in _layouts/.
title: Michael Chapman
description: >-
  A long gallery in a castle library, holding things Michael Chapman has made
  or kept: old reports, a CV, and a few oddities.
author: Michael Chapman
locale: en_GB
url: "https://michaelchapman.me"

# Profile links, used by jekyll-seo-tag for search-engine metadata.
social:
  name: Michael Chapman
  links:
    - https://github.com/michaelchapman

# Everything in the gallery that has its own page (papers, the portrait, ...).
# Each is one Markdown file in _objects/; `bay` says where it hangs.
collections:
  objects:
    output: true
    permalink: /library/:name/

markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Files/folders Jekyll should not try to process as site content.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor

defaults:
  # Default share image for link previews (jekyll-seo-tag) on every page.
  - scope:
      path: ""
    values:
      image: /assets/images/social-card.png
      layout: library
  - scope:
      type: objects
    values:
      layout: object
