# Site settings used by both Jekyll and the minima theme.
title: Michael Chapman
description: >-
  Notes and writing on health data infrastructure, Secure Data Environments,
  and clinical research from Michael Chapman.
author: Michael Chapman
locale: en_GB
url: "https://michaelchapman.me"

# Profile links, used by jekyll-seo-tag for search-engine metadata.
social:
  name: Michael Chapman
  links:
    - https://github.com/michaelchapman

# Theme
theme: minima
minima:
  # "auto" follows the visitor's light/dark system setting.
  skin: auto
  date_format: "%-d %B %Y"
  # Pages shown in the top navigation bar, in order.
  nav_pages:
    - about.md
    - cv.md
    - work.md
    - writing.md
  # Icons in the footer (Font Awesome brand icon names).
  social_links:
    - title: Michael Chapman on GitHub
      icon: github
      url: "https://github.com/michaelchapman"

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Files/folders Jekyll should not try to process as site content.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor

# Default share image for link previews (jekyll-seo-tag) on every page.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/social-card.png
