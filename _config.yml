# Site settings. For now the site is four standalone HTML pages (index.html,
# top-banana/index.html, kings-line/index.html and brasshaven/index.html) with
# no theme or layout; Jekyll copies them as-is.
title: Michael Chapman
locale: en_GB
url: "https://michaelchapman.me"

plugins:
  - jekyll-sitemap

# Files/folders Jekyll should not copy into the site.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
