<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1813">
<title>Brasshaven</title>
<meta name="description" content="A steampunk harbour town to build. Tap the water to raise houses in brick, brass, copper, cast iron, glass and timber; engine houses power the clockwork, and airships moor at the tallest tower.">
<link rel="canonical" href="https://michaelchapman.me/brasshaven/">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Michael Chapman">
<meta property="og:title" content="Brasshaven">
<meta property="og:description" content="A steampunk harbour town to build. Tap the water to raise houses in brick, brass, copper, cast iron, glass and timber; engine houses power the clockwork, and airships moor at the tallest tower.">
<meta property="og:url" content="https://michaelchapman.me/brasshaven/">
<meta property="og:image" content="https://michaelchapman.me/brasshaven/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

</head>
<body>
<style>
/* Layout: one full-bleed harbour canvas; walnut-and-brass instrument plates float at its edges
   (nameplate top-left, gear menu top-right, material coins and tool dock bottom-centre). Single deliberate look. */
:root{
  --sky:#e7cfa3;          /* golden-hour haze behind the canvas */
  --panel:#1f1813;        /* smoked walnut */
  --panel-hi:#2e241b;
  --brass:#c69a4b;
  --brass-hi:#efcf86;
  --cream:#f3e5c6;
  --muted:#c2b08e;
  --oxblood:#b2442f;
  --verdigris:#5fa592;
  --shadow:rgba(24,14,6,.38);
  --font-display:"IM Fell English SC","IM Fell English",Georgia,"Times New Roman",serif;
  --font-ui:"Alegreya Sans","Gill Sans","Trebuchet MS",system-ui,sans-serif;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{touch-action:none}
.menu,.pc-sheet{touch-action:pan-y}
body{margin:0;background:var(--sky);color:var(--cream);font-family:var(--font-ui);font-size:15px;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 95% at 50% 46%,transparent 58%,rgba(64,38,14,.30) 100%)}

.plate{background:linear-gradient(180deg,var(--panel-hi),var(--panel));border:1px solid rgba(198,154,75,.62);border-radius:12px;box-shadow:inset 0 1px 0 rgba(239,207,134,.22),inset 0 -1px 0 rgba(0,0,0,.4),0 8px 22px var(--shadow);position:relative}
.plate.riveted::before,.plate.riveted::after{content:"";position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--brass-hi),var(--brass) 55%,#6d5124);box-shadow:0 1px 1px rgba(0,0,0,.5)}
.plate.riveted::before{left:7px}
.plate.riveted::after{right:7px}

.brand{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,calc(env(safe-area-inset-left,0px) + 12px));padding:7px 14px 8px;pointer-events:none;display:flex;flex-direction:column;gap:1px}
.brand h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.05;letter-spacing:.03em;color:var(--brass-hi);text-shadow:0 1px 0 rgba(0,0,0,.55)}
.brand p{margin:0;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}

.gear{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));width:50px;height:50px;padding:0;display:grid;place-items:center;color:var(--brass-hi);cursor:pointer}
.gear svg{width:26px;height:26px}
.gear[aria-expanded="true"]{background:linear-gradient(180deg,#3a2d20,#241b14)}

.side{position:absolute;top:calc(env(safe-area-inset-top,0px) + 74px);right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));display:flex;flex-direction:column;gap:10px}
.round{width:50px;height:50px;padding:0;display:grid;place-items:center;border-radius:50%;color:var(--brass-hi);cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.round svg{width:26px;height:26px;position:relative}
.round:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
.round:active{transform:translateY(1px)}
.tension{position:absolute;inset:3px;border-radius:50%;background:conic-gradient(var(--brass-hi) calc(var(--t,0) * 1turn),rgba(0,0,0,.42) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));pointer-events:none}
#key-btn.winding{background:linear-gradient(180deg,#3a2d20,#241b14)}
.menu{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));width:min(310px,calc(100vw - 32px));max-height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 90px);overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:2px;z-index:5}
.menu button.item{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:8px;font-weight:700;font-size:15px;color:var(--cream);cursor:pointer}
.menu button.item:hover{background:rgba(239,207,134,.08)}
.menu button.item:focus-visible{outline:2px solid var(--brass-hi);outline-offset:-2px}
.menu .val{font-weight:500;color:var(--muted)}
.menu .danger{color:#f0a48f}
.menu .rule{height:1px;margin:4px 6px;background:linear-gradient(90deg,transparent,rgba(198,154,75,.5),transparent)}
.menu .seg{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:0 6px 0 12px;font-weight:700}
.menu .seg div{display:flex;gap:3px;padding:3px;border-radius:8px;background:rgba(0,0,0,.28)}
.menu .seg button{all:unset;cursor:pointer;min-width:44px;height:34px;display:grid;place-items:center;padding:0 8px;border-radius:6px;font-size:13px;font-weight:700;color:var(--muted)}
.menu .seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:#2a1d10}
.menu .seg button:focus-visible{outline:2px solid var(--brass-hi)}
.box{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:8px;background:rgba(0,0,0,.24);border:1px solid rgba(198,154,75,.35)}
.box.warn{background:rgba(178,68,47,.16);border-color:rgba(178,68,47,.45)}
.box p,.box label{margin:0;font-size:14px;line-height:1.35}
.box .row{display:flex;gap:8px}
.box button{all:unset;cursor:pointer;flex:1;text-align:center;min-height:40px;border-radius:7px;font-weight:800;font-size:14px}
.box .yes{background:var(--oxblood);color:#fff2e6}
.box .go{background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:#24180d}
.box .no{background:rgba(239,207,134,.12);color:var(--cream)}
.box button:focus-visible{outline:2px solid var(--brass-hi)}
.box textarea{box-sizing:border-box;width:100%;min-height:64px;resize:vertical;padding:8px;border-radius:6px;border:1px solid rgba(198,154,75,.5);background:#15100c;color:var(--cream);font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;-webkit-user-select:text;user-select:text}
.box textarea:focus-visible{outline:2px solid var(--brass-hi)}
.box .msg{font-size:13px;color:var(--muted)}
.box .msg.err{color:#f0a48f}
.menu .how{margin:6px 12px 6px;font-size:13px;line-height:1.45;color:var(--muted)}

/* bottom instruments: material coins above the tool dock */
.palette{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);display:flex;align-items:center;gap:6px;padding:5px 8px 5px 12px}
.mat-name{font-family:var(--font-display);font-size:17px;color:var(--brass-hi);min-width:78px;white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.coin{all:unset;box-sizing:border-box;cursor:pointer;width:34px;height:34px;border-radius:50%;border:2px solid rgba(0,0,0,.5);box-shadow:inset 0 1px 1px rgba(255,255,255,.35),inset 0 -2px 3px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.5);transition:transform .12s ease}
.coin[aria-checked="true"]{outline:2px solid var(--brass-hi);outline-offset:2px;transform:scale(1.06)}
.coin:focus-visible{outline:2px dashed var(--brass-hi);outline-offset:3px}
.coin.m0{background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(222,206,180,.6) 5px 6px),repeating-linear-gradient(90deg,transparent 0 9px,rgba(222,206,180,.45) 9px 10px),#913b2e}
.coin.m1{background:radial-gradient(circle at 50% 50%,rgba(70,48,14,.7) 1.4px,transparent 1.8px) 3px 3px/9px 9px,radial-gradient(circle at 35% 30%,#fff0b5,#d1a14a 45%,#7a5a20)}
.coin.m2{background:radial-gradient(circle at 70% 72%,rgba(86,160,138,.95),rgba(86,160,138,0) 46%),radial-gradient(circle at 35% 30%,#f2b38b,#b0643a 48%,#5a2f18)}
.coin.m3{background:radial-gradient(circle,rgba(170,176,182,.8) 1.3px,transparent 1.7px) 2px 2px/8px 8px,radial-gradient(circle at 35% 30%,#7d848c,#3a3e44 55%,#1c1e21)}
.coin.m4{background:linear-gradient(90deg,transparent 46%,#f1ebdb 46% 56%,transparent 56%),linear-gradient(0deg,transparent 46%,#f1ebdb 46% 56%,transparent 56%),radial-gradient(circle at 60% 70%,#3d6a35,transparent 55%),linear-gradient(135deg,#d4ece8,#79aea8 50%,#2f5f5c)}
.coin.m5{background:repeating-linear-gradient(0deg,#7a5636 0 5px,#5a3c24 5px 6px)}

.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:center;gap:6px;padding:5px 22px}
.tools{display:flex;gap:3px;padding:3px;border-radius:10px;background:rgba(0,0,0,.3);box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.tool{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:52px;min-width:62px;padding:0 8px;border-radius:8px;font-weight:800;font-size:12.5px;letter-spacing:.03em;color:var(--cream)}
.tool svg{width:22px;height:22px;flex:none}
.tool[aria-checked="true"]{background:linear-gradient(180deg,var(--brass-hi),var(--brass) 70%,#9f7835);color:#24180d;box-shadow:inset 0 1px 0 rgba(255,245,215,.6),0 1px 2px rgba(0,0,0,.5)}
.tool#tool-remove[aria-checked="true"]{background:linear-gradient(180deg,#e0785f,var(--oxblood) 70%,#7e2c1f);color:#fff1e4;box-shadow:inset 0 1px 0 rgba(255,220,200,.45),0 1px 2px rgba(0,0,0,.5)}
.tool:focus-visible,.icon:focus-visible,.gear:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
.dock .rule{width:1px;height:30px;background:linear-gradient(180deg,transparent,rgba(198,154,75,.6),transparent);margin:0 2px}
.icon{all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:48px;display:grid;place-items:center;border-radius:8px;color:var(--brass-hi)}
.icon svg{width:24px;height:24px}
.icon:disabled{color:rgba(194,176,142,.32);cursor:default}
.icon:not(:disabled):active,.tool:active,.coin:active{transform:translateY(1px)}

.hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 144px);transform:translateX(-50%);max-width:calc(100vw - 32px);width:max-content;padding:9px 16px;text-align:center;font-size:14.5px;line-height:1.35;font-weight:700;color:var(--cream);background:rgba(31,24,19,.88);border:1px solid rgba(198,154,75,.5);border-radius:10px;box-shadow:0 6px 18px var(--shadow);transition:opacity .45s ease,transform .45s ease;pointer-events:none}
.hint span{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.hint.gone{opacity:0;transform:translate(-50%,6px);visibility:hidden;transition:opacity .45s ease,transform .45s ease,visibility 0s .45s}
.found{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translate(-50%,-16px);opacity:0;visibility:hidden;max-width:calc(100vw - 32px);width:max-content;padding:9px 30px 11px;text-align:center;border-radius:5px;background:linear-gradient(180deg,#f6dc98,#d2a656 48%,#a47a36);color:#2a1d10;box-shadow:inset 0 0 0 2px rgba(74,50,18,.6),inset 0 0 0 4px rgba(255,240,200,.35),0 8px 22px var(--shadow);transition:opacity .5s ease,transform .5s ease,visibility 0s .5s;pointer-events:none;z-index:4}
.found.on{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .5s ease,transform .5s cubic-bezier(.2,1.4,.4,1)}
.found::before,.found::after{content:"";position:absolute;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1c4,#8a6326 70%)}
.found::before{left:10px}.found::after{right:10px}
.found small{display:block;font:800 10px var(--font-ui);letter-spacing:.2em;text-transform:uppercase;color:#5a3d16}
.found b{display:block;font-family:var(--font-display);font-weight:400;font-size:27px;line-height:1.1;text-shadow:0 1px 0 rgba(255,240,200,.5)}
.found span{display:block;font-size:13px;font-weight:600;color:#3a2817}
.marks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.marks li{display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.35;color:var(--muted)}
.marks li div{flex:1}
.marks li b{display:block;font-size:14.5px;color:var(--cream)}
.marks li.no b{color:var(--muted);font-style:italic;font-weight:600}
.box .marks button{flex:none;min-width:58px;min-height:34px;font-size:13px}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.slots li{display:flex;gap:10px;align-items:flex-start}
.slots img,.slots .blank{flex:none;width:70px;height:46px;border-radius:5px;object-fit:cover;background:#15100c;border:1px solid rgba(198,154,75,.35)}
.slots li.cur img,.slots li.cur .blank{border-color:var(--brass-hi);box-shadow:0 0 0 1px var(--brass-hi)}
.slots li>div{flex:1;min-width:0;font-size:12.5px;line-height:1.35;color:var(--muted)}
.slots b{display:block;font-size:14.5px;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slots .row{margin-top:5px}
.box .slots button{min-height:32px;font-size:13px}

.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--sky);color:#3a2817;transition:opacity .6s ease}
.loading div{display:flex;flex-direction:column;align-items:center;gap:6px;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.loading b{font-family:var(--font-display);font-weight:400;font-size:40px;letter-spacing:.03em}
.loading span{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.7;text-align:center}
.loading i{font-size:13px;opacity:.6;margin-top:10px;text-align:center}
.loading.done{opacity:0;pointer-events:none}
.stats{position:absolute;left:12px;bottom:12px;font:12px/1.3 ui-monospace,monospace;color:#2a1d10;background:rgba(255,240,210,.7);padding:4px 6px;border-radius:4px;pointer-events:none}

#harbour-no{max-width:calc(100vw - 170px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box input{box-sizing:border-box;width:100%;height:42px;padding:0 10px;border-radius:6px;border:1px solid rgba(198,154,75,.5);background:#15100c;color:var(--cream);font:600 15px var(--font-ui);-webkit-user-select:text;user-select:text}
.box input:focus-visible{outline:2px solid var(--brass-hi);outline-offset:1px}
.menu .seg input[type=range]{-webkit-appearance:none;appearance:none;width:148px;height:32px;margin:0 6px 0 0;background:transparent;cursor:pointer}
.menu .seg input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--brass) var(--v,70%),rgba(0,0,0,.42) var(--v,70%))}
.menu .seg input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--brass-hi),var(--brass) 55%,#6d5124);box-shadow:0 1px 2px rgba(0,0,0,.55)}
.menu .seg input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(0,0,0,.42)}
.menu .seg input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--brass)}
.menu .seg input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--brass-hi),var(--brass) 55%,#6d5124)}
.menu .seg input[type=range]:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}

/* tips: one at a time, the control it names glows */
.hint.tip{padding-right:26px}
.hint .step{display:block;margin-bottom:1px;font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
.hint .hint-x{all:unset;pointer-events:auto;cursor:pointer;position:absolute;top:-11px;right:-11px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:17px;line-height:1;color:var(--cream);background:var(--panel);border:1px solid rgba(198,154,75,.65);box-shadow:0 2px 6px var(--shadow)}
.hint .hint-x:focus-visible{outline:2px solid var(--brass-hi)}
.hint.gone .hint-x{pointer-events:none}
@keyframes beckon{0%,100%{box-shadow:0 0 0 0 rgba(239,207,134,0),0 8px 22px var(--shadow)}50%{box-shadow:0 0 0 7px rgba(239,207,134,.4),0 8px 22px var(--shadow)}}
@keyframes beckon-coin{0%,100%{outline:2px solid rgba(239,207,134,0);outline-offset:2px}50%{outline:2px solid rgba(239,207,134,.95);outline-offset:6px}}
.beckon{animation:beckon 1.8s ease-in-out infinite}
.coin.beckon{animation-name:beckon-coin}
#app.calm .beckon{animation:none;box-shadow:0 0 0 4px rgba(239,207,134,.5),0 8px 22px var(--shadow)}
#app.calm .coin.beckon{box-shadow:none;outline:2px solid var(--brass-hi);outline-offset:5px}

/* postcard mode: everything but the shutter bar steps aside; the frame shows what the card will hold */
#app.pc .brand,#app.pc .gear,#app.pc .side,#app.pc .menu,#app.pc .palette,#app.pc .dock,#app.pc .hint{display:none}
.pc-frame{position:absolute;pointer-events:none;box-shadow:0 0 0 100vmax rgba(18,11,5,.4);outline:1px solid rgba(243,229,198,.3)}
.pc-frame i{position:absolute;width:24px;height:24px;border:0 solid var(--cream)}
.pc-frame i:nth-child(1){left:-4px;top:-4px;border-width:3px 0 0 3px}
.pc-frame i:nth-child(2){right:-4px;top:-4px;border-width:3px 3px 0 0}
.pc-frame i:nth-child(3){left:-4px;bottom:-4px;border-width:0 0 3px 3px}
.pc-frame i:nth-child(4){right:-4px;bottom:-4px;border-width:0 3px 3px 0}
.pc-bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:center;gap:10px;padding:7px 24px}
.pc-bar .txt{all:unset;box-sizing:border-box;cursor:pointer;min-width:84px;height:48px;padding:0 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:8px;font-weight:800;font-size:12.5px;letter-spacing:.03em;color:var(--cream)}
.pc-bar .txt svg{width:22px;height:22px;color:var(--brass-hi)}
.pc-bar .txt:hover{background:rgba(239,207,134,.08)}
.shutter{all:unset;box-sizing:border-box;cursor:pointer;width:58px;height:58px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3cc,var(--brass) 55%,#6d5124);box-shadow:inset 0 0 0 5px rgba(31,24,19,.6),0 0 0 2px rgba(239,207,134,.75),0 2px 6px rgba(0,0,0,.5)}
.shutter:active{transform:scale(.95)}
.pc-bar .txt:focus-visible,.shutter:focus-visible{outline:2px solid var(--brass-hi);outline-offset:3px}
.flash{position:absolute;inset:0;background:#fffaf0;opacity:0;pointer-events:none;transition:opacity .6s ease-out}
.flash.on{opacity:.85;transition:none}
.pc-sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100vw - 32px));max-height:calc(100% - 32px);overflow:auto;box-sizing:border-box;padding:12px;display:flex;flex-direction:column;gap:10px;z-index:7}
.pc-sheet img{display:block;width:100%;height:auto;max-height:min(64vh,600px);object-fit:contain;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.pc-sheet .row{flex-wrap:wrap}
.pc-sheet .box button{min-width:110px}
.hold{position:absolute;width:88px;height:88px;margin:-44px 0 0 -44px;pointer-events:none;opacity:0;transition:opacity .12s}
.hold.on{opacity:1}
.hold svg{width:88px;height:88px;display:block;transform:rotate(-90deg)}
.hold circle{fill:rgba(255,122,92,.12);stroke:#ff7a5c;stroke-width:5;stroke-linecap:round;stroke-dasharray:239;stroke-dashoffset:239;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.hold.on circle{animation:holdfill var(--d,400ms) linear forwards}
@keyframes holdfill{to{stroke-dashoffset:0}}
.home-pill{position:absolute;top:calc(env(safe-area-inset-top,0px) + 80px);left:max(16px,calc(env(safe-area-inset-left,0px) + 12px));display:flex;align-items:center;gap:7px;height:42px;padding:0 15px 0 11px;border-radius:21px;font:800 13.5px var(--font-ui);letter-spacing:.02em;color:var(--cream);cursor:pointer;transition:opacity .3s ease,transform .3s ease}
.home-pill svg{width:20px;height:20px;color:var(--brass-hi)}
.home-pill.off{opacity:0;transform:translateY(-6px);pointer-events:none;visibility:hidden;transition:opacity .3s ease,transform .3s ease,visibility 0s .3s}
.home-pill:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
#app.pc .home-pill{display:none}
@media (max-height:460px){

}

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';

/* ============================================================
   Brasshaven, milestone 4: polish and launch. Postcards, first-run tips,
   settings and quality tiers on top of milestone 3's working town.
   ============================================================ */

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('brasshaven:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('brasshaven:' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};
const COARSE = matchMedia('(pointer: coarse)').matches;
let REDUCED = (() => { const m = store.get('motion', null); return m ? m === 'calm' : matchMedia('(prefers-reduced-motion: reduce)').matches; })();

// ---------- constants ----------
const SEED = 1887;
const MAXL = 12;                 // storeys above the quay
const WATER_Y = 0, GROUND_TOP = 0.42, QUAY_BOTTOM = -1.4, FLOOR_H = 0.98, OH = 0.1;
const baseY = (y) => (y === 0 ? QUAY_BOTTOM : GROUND_TOP + (y - 1) * FLOOR_H);
const topY = (y) => (y === 0 ? GROUND_TOP : GROUND_TOP + y * FLOOR_H);

// materials
const M_BRICK = 0, M_BRASS = 1, M_COPPER = 2, M_IRON = 3, M_GLASS = 4, M_TIMBER = 5;
const MATS = [
  { name: 'Brick', line: 'terraces, arched windows, slate roofs' },
  { name: 'Brass', line: 'riveted plate, portholes and clockwork' },
  { name: 'Copper', line: 'verdigris sheeting, spires and onion domes' },
  { name: 'Cast iron', line: 'engine houses that power everything joined to them' },
  { name: 'Glass', line: 'conservatories full of green' },
  { name: 'Timber', line: 'clapboard and piers; by the water it turns a mill wheel' },
];
const ROOF_HS = [0.5, 0.46, 0.62, 0.22, 0.42, 0.56];

// surface ids (read by the town shader)
const S_PLAIN = 0, S_BRICK = 1, S_STONE = 2, S_COBBLE = 3, S_SLATE = 4, S_BRASS = 5, S_IRON = 6, S_GLASS = 7, S_WOOD = 8, S_COPPER = 9, S_TERRA = 10,
  S_PLATE_B = 11, S_PLATE_I = 12, S_CLAP = 13, S_SHINGLE = 14, S_GREEN = 15, S_GRASS = 16, S_LEAF = 17;

// ---------- small math ----------
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash4(a, b, c, d) {
  let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul((b | 0) + 0x165667b1, 0x9e3779b1) ^ Math.imul((c | 0) + 0x61c88647, 0x85ebca77) ^ Math.imul((d | 0) + 0x7f4a7c15, 0xc2b2ae3d);
  h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; h = Math.imul(h, 0x297a2d39); h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}
const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul3 = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const nrm3 = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const neg3 = (a) => [-a[0], -a[1], -a[2]];
const UP = [0, 1, 0], DOWN = [0, -1, 0], XA = [1, 0, 0], ZA = [0, 0, 1];

/* ============================================================
   1. The organic grid
   hexagon of triangles -> random pairs -> all quads -> relaxed.
   The harbour can grow: bands of cells around the first hexagon are made
   the same way, after it, so the cells of a smaller harbour never move
   and its vertex numbers stay the same in saves and town codes.
   ============================================================ */
const BANDS = [10, 12, 14, 16, 18];      // hexagon rings: the first harbour, then each band it can grow by
function buildGrid(seed) {
  const L = 2, H3 = Math.sqrt(3) / 2, NMAX = BANDS[BANDS.length - 1];
  const pts = [], band = [];
  const pid = new Map();
  const key = (q, r) => (q + 64) * 256 + (r + 64);
  const hexR = (q, r) => Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r));
  const get = (q, r) => pid.get(key(q, r));
  const eKey = (a, b) => (a < b ? a * 100000 + b : b * 100000 + a);
  const midMap = new Map(), quads = [];
  const mid = (a, b, bi) => { const k = eKey(a, b); let m = midMap.get(k); if (m === undefined) { m = pts.length / 2; pts.push((pts[2 * a] + pts[2 * b]) / 2, (pts[2 * a + 1] + pts[2 * b + 1]) / 2); band.push(bi); midMap.set(k, m); } return m; };
  const outline = () => {
    const ecount = new Map(), V = pts.length / 2, edge = new Uint8Array(V);
    for (let q = 0; q < quads.length / 4; q++) for (let j = 0; j < 4; j++) { const k = eKey(quads[4 * q + j], quads[4 * q + ((j + 1) & 3)]); ecount.set(k, (ecount.get(k) || 0) + 1); }
    for (const [k, c] of ecount) if (c === 1) { edge[Math.floor(k / 100000)] = 1; edge[k % 100000] = 1; }
    return { ecount, edge };
  };
  const edgeBand = [], made = new Set();
  const tKey = (t) => t.slice().sort((x, y) => x - y).join(',');
  let sc = 1;
  BANDS.forEach((N, bi) => {
    const N0 = bi ? BANDS[bi - 1] : -1, rnd = mulberry32(bi ? seed * 31 + bi : seed), v0 = pts.length / 2, q0 = quads.length / 4;
    for (let r = -N; r <= N; r++) for (let q = -N; q <= N; q++) {
      const d = hexR(q, r); if (d > N || d <= N0) continue;
      pid.set(key(q, r), pts.length / 2); band.push(bi);
      pts.push((q + r / 2) * L, r * H3 * L);
    }
    const tris = [];
    // every lattice triangle not made yet, including ones an earlier hexagon's edge left out
    const keep = (t) => { const k = tKey(t); if (made.has(k)) return false; made.add(k); return true; };
    for (let r = -N; r <= N; r++) for (let q = -N; q <= N; q++) {
      const a = get(q, r); if (a === undefined || hexR(q, r) > N) continue;
      const b = get(q + 1, r), c = get(q, r + 1), d = get(q + 1, r + 1);
      const ok = (x) => x !== undefined && band[x] <= bi;
      if (ok(b) && ok(c) && keep([a, b, c])) tris.push([a, b, c]);
      if (ok(b) && ok(c) && ok(d) && keep([b, d, c])) tris.push([b, d, c]);
    }
    const edgeTris = new Map();
    tris.forEach((t, ti) => { for (let j = 0; j < 3; j++) { const k = eKey(t[j], t[(j + 1) % 3]); let arr = edgeTris.get(k); if (!arr) { arr = []; edgeTris.set(k, arr); } arr.push(ti); } });
    const order = tris.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    const mate = new Int32Array(tris.length).fill(-1);
    for (const ti of order) {
      if (mate[ti] >= 0) continue;
      const t = tris[ti]; const cands = [];
      for (let j = 0; j < 3; j++) for (const o of edgeTris.get(eKey(t[j], t[(j + 1) % 3]))) if (o !== ti && mate[o] < 0) cands.push(o);
      if (cands.length) { const o = cands[Math.floor(rnd() * cands.length)]; mate[ti] = o; mate[o] = ti; }
    }
    const polys = [];
    for (let ti = 0; ti < tris.length; ti++) {
      const o = mate[ti];
      if (o < 0) { polys.push(tris[ti].slice()); continue; }
      if (o < ti) continue;
      const t = tris[ti], u = tris[o];

   Every filled (vertex, level) is a dual cell: the polygon of
   quad centres around the vertex. Walls stand on dual edges that
   face an empty neighbour; corners resolve at quad centres.
   ============================================================ */
const V2 = (x, y) => new THREE.Vector2(x, y);
function rectPts(sc, ow, tb, oh) { return [[sc - ow / 2, tb], [sc + ow / 2, tb], [sc + ow / 2, tb + oh], [sc - ow / 2, tb + oh]]; }
function archPts(sc, ow, tb, sh) {
  const r = ow / 2, p = [[sc - r, tb], [sc + r, tb], [sc + r, tb + sh]];
  for (let j = 1; j < 8; j++) { const a = (Math.PI * j) / 8; p.push([sc + r * Math.cos(a), tb + sh + r * Math.sin(a)]); }
  p.push([sc - r, tb + sh]);
  return p;
}
// a pointed (equilateral) arch, for church windows
function pointPts(sc, ow, tb, sh) {
  const r = ow / 2, p = [[sc - r, tb], [sc + r, tb], [sc + r, tb + sh]];
  for (let j = 1; j <= 4; j++) { const a = (Math.PI / 3) * (j / 4); p.push([sc - r + ow * Math.cos(a), tb + sh + ow * Math.sin(a)]); }
  for (let j = 3; j >= 1; j--) { const a = (Math.PI / 3) * (j / 4); p.push([sc + r - ow * Math.cos(a), tb + sh + ow * Math.sin(a)]); }
  p.push([sc - r, tb + sh]);
  return p;
}
function circlePts(sc, tc, r, n) { const p = []; for (let j = 0; j < n; j++) { const a = (j / n) * Math.PI * 2; p.push([sc + r * Math.cos(a), tc + r * Math.sin(a)]); } return p; }

function edgeLen(v, i) { const Qs = ringQ[v], k = Qs.length; const qa = Qs[(i - 1 + k) % k], qb = Qs[i]; return Math.hypot(CX[qb] - CX[qa], CZ[qb] - CZ[qa]); }
function doorEdge(v) {
  if (!F(v, 0) || !F(v, 1)) return -1;
  const W = ringW[v]; let best = -1, bh = 2;
  for (let i = 0; i < W.length; i++) {
    const w = W[i];
    if (F(w, 0) && !F(w, 1) && edgeLen(v, i) >= 0.5) { const h = hash4(v, i, 9, 1); if (h < bh) { bh = h; best = i; } }
  }
  return best;
}
function wallFrame(v, i) {
  const Qs = ringQ[v], k = Qs.length;
  const qa = Qs[(i - 1 + k) % k], qb = Qs[i];
  const ax = CX[qa], az = CZ[qa];
  let ux = CX[qb] - ax, uz = CZ[qb] - az; const W = Math.hypot(ux, uz); ux /= W; uz /= W;
  let nx = uz, nz = -ux;
  if (nx * ((ax + CX[qb]) / 2 - X[v]) + nz * ((az + CZ[qb]) / 2 - Z[v]) < 0) { nx = -nx; nz = -nz; }
  return { ax, az, ux, uz, nx, nz, W, U: [ux, 0, uz], N: [nx, 0, nz] };
}
function fanAt(g, v, yy, n, col, s, darkFn) {
  const Wn = ringW[v], Qs = ringQ[v], k = Wn.length;
  const c0 = [X[v], yy, Z[v]];
  const ring = [], rc = [];
  for (let i = 0; i < k; i++) {
    const qa = Qs[(i - 1 + k) % k], qb = Qs[i];
    ring.push([(CX[qa] + CX[qb]) / 2, yy, (CZ[qa] + CZ[qb]) / 2]); rc.push(darkFn ? darkFn(i, 0) : col);
    ring.push([CX[qb], yy, CZ[qb]]); rc.push(darkFn ? darkFn(i, 1) : col);
  }
  for (let j = 0; j < ring.length; j++) { const j1 = (j + 1) % ring.length; g.tri(c0, ring[j], ring[j1], n, col, s, rc[j], rc[j1]); }
}

function buildColumn(g, v) {
  const m = cols[v]; if (!m) return;
  for (let y = 0; y <= MAXL; y++) {
    if (!((m >> y) & 1)) continue;
    if (y === 0) buildGround(g, v); else buildStorey(g, v, y);
  }
  buildStilts(g, v);
}

// ---------- ground: stone quays, timber piers, courtyard gardens ----------
function groundDark(v, darkCol, col) {
  const Wn = ringW[v], Xs = ringX[v], k = Wn.length;
  return (i, kind) => (kind === 0 ? (F(Wn[i], 1) ? darkCol : col) : (F(Wn[i], 1) || F(Xs[i], 1) || F(Wn[(i + 1) % k], 1) ? darkCol : col));
}
function buildLamp(g, lx, lz, y0) {
  g.box([lx, y0 + 0.04, lz], XA, UP, ZA, 0.045, 0.04, 0.045, C_IRON, S_IRON, 4);
  g.cyl([lx, y0 + 0.08, lz], [lx, y0 + 0.86, lz], 0.022, 0.016, 7, C_IRON, S_IRON, false);
  g.box([lx, y0 + 0.8, lz], XA, UP, ZA, 0.07, 0.008, 0.008, C_IRON, S_IRON);
  g.glow = 1.7; g.box([lx, y0 + 0.93, lz], XA, UP, ZA, 0.05, 0.07, 0.05, C_LAMP, S_GLASS); g.glow = 0;
  g.dyn.lamps.push([lx, y0 + 0.93, lz]);
  g.cyl([lx, y0 + 1.0, lz], [lx, y0 + 1.07, lz], 0.07, 0.0, 4, C_BRASS, S_BRASS);
  g.ball([lx, y0 + 1.085, lz], 0.016, C_BRASS, S_BRASS);
}
function buildGround(g, v) {
  if (M(v, 0) === M_TIMBER) { buildPier(g, v); return; }
  const Wn = ringW[v], k = Wn.length;
  const water = Wn.map((w) => !F(w, 0));
  const open = Wn.map((w) => !F(w, 0) || M(w, 0) === M_TIMBER);
  const tint = 0.9 + hash4(v, 0, 5, 5) * 0.2;
  const stone = mul3(C_STONE, tint);
  const houseAbove = F(v, 1);
  let steps = -1;
  for (let i = 0; i < k; i++) {
    if (!open[i]) continue;
    const f = wallFrame(v, i);
    const P = (s, yy, d) => [f.ax + f.ux * s + f.nx * d, yy, f.az + f.uz * s + f.nz * d];
    g.quad(P(0, QUAY_BOTTOM, 0), P(f.W, QUAY_BOTTOM, 0), P(f.W, GROUND_TOP - 0.09, 0), P(0, GROUND_TOP - 0.09, 0), f.N, stone, S_STONE);
    const convA = open[(i - 1 + k) % k], convB = open[(i + 1) % k];
    const a = convA ? -0.07 : 0, b = f.W + (convB ? 0.07 : 0);
    g.box(P((a + b) / 2, GROUND_TOP - 0.035, 0.025), f.U, UP, f.N, (b - a) / 2, 0.055, 0.045, C_COPING, S_STONE, 16);
    if (!water[i]) continue;
    const sc = f.W / 2;
    // water stairs down the quay wall
    if (steps < 0 && !houseAbove && f.W > 0.78 && hash4(v, i, 64, 0) < 0.2) {
      steps = i;
      for (let j = 0; j < 6; j++) {
        const s0 = sc - 0.36 + j * 0.12, top = GROUND_TOP - (j + 1) * 0.075;
        g.box(P(s0 + 0.06, (top - 0.35) / 2, 0.11), f.U, UP, f.N, 0.06, (top + 0.35) / 2, 0.11, C_COPING, S_STONE, 16);
      }
    } else if (f.W > 0.5 && hash4(v, i, 63, 0) < 0.16) {
      // iron ladder for the boatmen
      for (const o of [-0.085, 0.085]) g.box(P(sc + o, (GROUND_TOP + 0.24 - 0.4) / 2, 0.035), f.U, UP, f.N, 0.011, (GROUND_TOP + 0.24 + 0.4) / 2, 0.011, C_IRON, S_IRON);
      for (let yy = -0.32; yy < GROUND_TOP - 0.02; yy += 0.095) g.box(P(sc, yy, 0.035), f.U, UP, f.N, 0.085, 0.007, 0.008, C_IRON, S_IRON);
    }
  }
  if (houseAbove) return;
  const lr = lmAt(v);
  if (lr && lr.kind === 'gasworks') { buildGasholder(g, v); return; }
  if (lr && lr.kind === 'market') { buildMarket(g, v); return; }
  if (courtyard[v]) { buildGarden(g, v); return; }
  for (let i = 0; i < k; i++) {
    if (!water[i] || i === steps || hash4(v, i, 61, 0) > 0.38) continue;
    const f = wallFrame(v, i);
    const bx = f.ax + f.ux * f.W / 2 - f.nx * 0.13, bz = f.az + f.uz * f.W / 2 - f.nz * 0.13;
    g.cyl([bx, GROUND_TOP, bz], [bx, GROUND_TOP + 0.11, bz], 0.042, 0.036, 8, C_IRON, S_IRON, false);
    g.cyl([bx, GROUND_TOP + 0.11, bz], [bx, GROUND_TOP + 0.145, bz], 0.058, 0.05, 8, C_IRON, S_IRON);
  }
  if (hash4(v, 0, 62, 0) < 0.32) buildLamp(g, X[v], Z[v], GROUND_TOP);
  fanAt(g, v, GROUND_TOP, UP, C_COBBLE, S_COBBLE, groundDark(v, C_COBBLE_DARK, C_COBBLE));
}
function buildPier(g, v) {
  const Wn = ringW[v], Qs = ringQ[v], k = Wn.length;
  const dk = GROUND_TOP;
  const pile = (x, z) => g.cyl([x, -0.7, z], [x, dk - 0.02, z], 0.052, 0.048, 7, C_PILE, S_WOOD, false);
  pile(X[v], Z[v]);
  for (const q of Qs) {
    let owner = 1e9;
    for (let j = 0; j < 4; j++) { const c = quads[4 * q + j]; if (F(c, 0) && M(c, 0) === M_TIMBER && c < owner) owner = c; }
    if (owner === v) pile(CX[q], CZ[q]);
  }
  for (let i = 0; i < k; i++) {
    if (F(Wn[i], 0)) continue;
    const f = wallFrame(v, i);
    const P = (s, yy, d) => [f.ax + f.ux * s + f.nx * d, yy, f.az + f.uz * s + f.nz * d];
    g.box(P(f.W / 2, dk - 0.07, 0.0), f.U, UP, f.N, f.W / 2 + 0.03, 0.07, 0.035, C_PILE, S_WOOD);

function buildGarden(g, v) {
  fanAt(g, v, GROUND_TOP + 0.004, UP, C_GRASS, S_GRASS, groundDark(v, C_GRASS_DARK, C_GRASS));
  const h = hash4(v, 0, 66, 0), x = X[v], z = Z[v], y0 = GROUND_TOP;
  const leaf = (n) => lin(LEAVES[Math.floor(hash4(v, n, 67, 0) * LEAVES.length)]);
  if (h < 0.5) {
    const s = 0.85 + hash4(v, 1, 68, 0) * 0.4;
    g.cyl([x, y0, z], [x, y0 + 0.4 * s, z], 0.035, 0.025, 6, C_PILE, S_WOOD, false);
    g.blob([x, y0 + 0.56 * s, z], 0.23 * s, leaf(1), S_LEAF, 0.85);
    g.blob([x + 0.09, y0 + 0.68 * s, z - 0.05], 0.17 * s, leaf(2), S_LEAF, 0.9);
    g.blob([x - 0.08, y0 + 0.64 * s, z + 0.07], 0.16 * s, leaf(3), S_LEAF, 0.9);
  } else if (h < 0.72) {
    // fountain: stone basin, brass bowl
    g.cyl([x, y0, z], [x, y0 + 0.11, z], 0.27, 0.25, 14, C_COPING, S_STONE, false);
    g.disc([x, y0 + 0.09, z], XA, ZA, UP, 0.235, 14, C_POOL, S_GLASS);
    g.cyl([x, y0, z], [x, y0 + 0.34, z], 0.032, 0.028, 7, C_COPING, S_STONE);
    g.cyl([x, y0 + 0.3, z], [x, y0 + 0.35, z], 0.04, 0.1, 10, C_BRASS, S_BRASS);
    g.ball([x, y0 + 0.4, z], 0.022, C_BRASS, S_BRASS);

    for (let j = 0; j < 9; j++) {

    }

}

// ---------- storeys ----------
function buildStorey(g, v, y) {
  const Wn = ringW[v], Xs = ringX[v], Qs = ringQ[v], k = Wn.length;
  const st = style(v), L = look(v, y);
  const walls = Wn.map((w) => !F(w, y));
  const roofHere = !F(v, y + 1);
  const below = F(v, y - 1);
  const door = y === 1 ? doorEdge(v) : -1;
  let tower = roofHere && y >= 6;
  if (tower) for (let l = 1; l < y; l++) if (!F(v, l)) { tower = false; break; }
  const eng = engineSpot(v), whl = wheelSpot(v), tt = towerTop(v);
  let worksWall = -1;
  if (tt >= 6 && y === tt - 1) { let bw = 0; for (let i = 0; i < k; i++) { if (!walls[i]) continue; const W = edgeLen(v, i); if (W >= 0.66 && W > bw) { bw = W; worksWall = i; } } }
  const ctx = { st, L, walls, roofHere, below, tower, engineWall: eng && eng.y === y ? eng.i : -1, wheelWall: whl && y === 1 ? whl.i : -1, worksWall, lm: lmAt(v) };
  for (let i = 0; i < k; i++) if (walls[i]) buildWall(g, v, y, i, ctx, door === i);
  if (ctx.wheelWall >= 0) buildWheelMount(g, v, ctx.wheelWall);
  for (let i = 0; i < k; i++) {
    if (walls[i] && walls[(i + 1) % k]) {
      const x = Xs[i];
      if (F(x, y) && x < v) continue;
      buildCorner(g, v, y, i, ctx);
    }
    // steam mains run up the seam where this facade carries on into a neighbour
    const a = Wn[i], b = Wn[(i + 1) % k], x = Xs[i], q = Qs[i];
    for (const nb of [a, b]) {
      const other = nb === a ? b : a;
      if (!F(nb, y) || F(other, y) || F(x, y) || nb < v) continue;
      if (M(nb, y) === L.m && hash4(v, nb, 0, 5) > 0.3) continue;
      let nx = CX[q] - (X[v] + X[nb]) / 2, nz = CZ[q] - (Z[v] + Z[nb]) / 2; const l = Math.hypot(nx, nz) || 1;
      buildMains(g, v, nb, y, [CX[q], CZ[q]], [nx / l, nz / l]);
    }
  }
  if (ctx.lm && ctx.lm.role === 'arch' && y === ctx.lm.y) g.dyn.marks.push({ type: 'gate', p: [X[v], baseY(y), Z[v]], w: inRadius(v) * 2 + 0.04, h: baseY(y) - GROUND_TOP, ax: ctx.lm.ax, v });
  if (!below) {
    buildUnderside(g, v, y, L);
    if (bridgeSet.has(v * 16 + y)) buildGirders(g, v, y);
  }
  if (roofHere) buildRoof(g, v, y, ctx);
}


// ---------- the machine in the walls ----------
function towerTop(v) { let t = 0; while (t < MAXL && F(v, t + 1)) t++; return t; }
// an engine house: the lowest cast-iron storey with a wide outside wall carries a steam engine
function engineSpot(v) {
  if (!(cols[v] & ~1)) return null;
  const Wn = ringW[v], door = doorEdge(v);
  for (let y = 1; y <= MAXL; y++) {
    if (!F(v, y) || M(v, y) !== M_IRON) continue;
    let best = -1, bh = -1;
    for (let i = 0; i < Wn.length; i++) {
      if (F(Wn[i], y) || (y === 1 && i === door) || edgeLen(v, i) < 0.62) continue;
      const h = hash4(v, i, 41, 0); if (h > bh) { bh = h; best = i; }
    }
    if (best >= 0) return { y, i: best };
  }
  return null;
}
// a mill: a timber house with a wall onto open water turns a wheel in the harbour
function wheelSpot(v) {
  if (!F(v, 1) || M(v, 1) !== M_TIMBER) return null;
  const Wn = ringW[v], Xs = ringX[v], k = Wn.length; let best = -1, bh = -1;
  for (let i = 0; i < k; i++) {
    const w = Wn[i];
    if (F(w, 0) || F(w, 1) || F(Xs[i], 0) || F(Xs[(i - 1 + k) % k], 0) || edgeLen(v, i) < 0.55) continue;
    const h = hash4(v, i, 44, 0); if (h > bh) { bh = h; best = i; }
  }
  return best >= 0 ? { i: best } : null;
}
// steam mains: paired copper pipes on the seam between two houses, with flanges, valves and gauges
function buildMains(g, v, nb, y, c, n) {
  const base = baseY(y), t1 = base + FLOOR_H;
  const tg = [-n[1], 0, n[0]], N3 = [n[0], 0, n[1]];
  const pos = (o, d, yy) => [c[0] + tg[0] * o + n[0] * d, yy, c[1] + tg[2] * o + n[1] * d];
  for (const o of [-0.045, 0.045]) {
    g.cyl(pos(o, 0.05, base), pos(o, 0.05, t1), 0.022, 0.022, 7, C_PIPE, S_BRASS, false);
    for (const yy of [base + 0.14, t1 - 0.08]) g.cyl(pos(o, 0.05, yy - 0.018), pos(o, 0.05, yy + 0.018), 0.033, 0.033, 7, C_PIPE, S_BRASS);
  }
  g.box(pos(0, 0.022, base + 0.5), tg, UP, N3, 0.075, 0.012, 0.022, C_IRON, S_IRON);
  const h = hash4(v, nb, y, 6);
  if (h < 0.4) {
    const vc = pos(0.045, 0.1, base + 0.42);
    g.cyl(pos(0.045, 0.05, base + 0.42), vc, 0.011, 0.011, 5, C_IRON, S_IRON);
    g.ring(vc, tg, UP, N3, 0.044, 0.058, 0.012, 10, C_OXIDE, S_IRON);
    for (let j = 0; j < 4; j++) { const a = (j * Math.PI) / 2 + 0.4; g.strut(vc, add3(vc, add3(mul3(tg, Math.cos(a) * 0.05), mul3(UP, Math.sin(a) * 0.05))), N3, 0.005, 0.005, C_OXIDE, S_IRON); }
  } else if (h < 0.62) {
    const gc = pos(-0.045, 0.105, base + 0.62);
    g.glow = 0.3; g.disc(gc, tg, UP, N3, 0.045, 10, C_DIAL, S_PLAIN); g.glow = 0;
    g.ring(add3(gc, mul3(N3, -0.014)), tg, UP, N3, 0.045, 0.06, 0.016, 10, C_BRASS, S_BRASS);
  }
  g.dyn.mains.push({ p: pos(0, 0.05, base + 0.5), n: N3 });
  if (hash4(v, nb, y, 9) < 0.55) g.dyn.emit.push({ p: pos(0.045, 0.08, t1 - 0.08), kind: 'leak', v, n: N3 });
}
// a mill engine on the outside of a cast-iron wall: red flywheel and crank, connecting rod, crosshead, cylinder
function buildEngine(g, v, f, P, W) {
  const R = Math.min(0.22, (W - 0.2) / 3.6), rc = R * 0.5, L = rc * 2.2, lp = 2 * rc + 0.07;
  const sf = W - R - 0.06, tc = 0.2 + R, dz = 0.11, dl = dz + 0.05;
  const at = (x, dd = dl) => P(sf - x, tc, dd);
  const solid = (a, b, r, seg, col, sf2) => { g.cyl(a, b, r, r, seg, col, sf2); g.cyl(b, a, r, r, seg, col, sf2); };
  const x0 = L + rc + 0.04, cl = 2 * rc + 0.06;
  solid(at(x0), at(x0 + cl), 0.07, 12, C_IRON, S_IRON);
  for (const x of [x0, x0 + cl]) solid(at(x - 0.012), at(x + 0.012), 0.086, 12, C_BRASS, S_BRASS);
  solid(at(x0 - 0.022), at(x0 - 0.008), 0.024, 8, C_BRASS, S_BRASS);
  for (const o of [-0.034, 0.034]) g.strut(add3(at(L - rc - 0.03), [0, o, 0]), add3(at(x0 - 0.022), [0, o, 0]), f.N, 0.007, 0.011, C_BRASS, S_BRASS);
  // bed and plinth under the cylinder
  g.box(P(sf - (x0 + cl / 2), tc - 0.1, dl / 2), f.U, UP, f.N, cl / 2 + 0.05, 0.03, dl / 2 + 0.03, C_OXIDE, S_IRON, 16);
  g.box(P(sf - (x0 + cl / 2), (tc - 0.13) / 2, dl / 2), f.U, UP, f.N, cl / 2 + 0.01, (tc - 0.13) / 2, dl / 2, C_IRON, S_PLATE_I, 16);
  // flywheel pedestal and bearing
  g.box(P(sf, tc / 2, 0.035), f.U, UP, f.N, 0.05, tc / 2, 0.035, C_OXIDE, S_IRON, 16);
  g.cyl(P(sf, tc, 0), P(sf, tc, dz + 0.035), 0.026, 0.026, 8, C_IRON, S_IRON);
  // exhaust up to the eaves; a steam main from the wall into the valve chest
  const ex = at(x0 + cl * 0.6), top = P(sf - (x0 + cl * 0.6), FLOOR_H - 0.14, dl);
  g.cyl(add3(ex, [0, 0.065, 0]), top, 0.02, 0.02, 7, C_IRON, S_IRON, false);
  g.cyl(top, add3(top, [0, 0.07, 0]), 0.032, 0.026, 7, C_BRASS, S_BRASS);
  g.cyl(P(sf - (x0 + cl * 0.25), tc + 0.26, 0), add3(at(x0 + cl * 0.25), [0, 0.06, 0]), 0.017, 0.017, 6, C_PIPE, S_BRASS, false);
  g.dyn.engines.push({ c: P(sf, tc, dz), n: f.N, e: mul3(f.U, -1), R, rc, L, lp, v, exhaust: add3(top, [0, 0.1, 0]) });
}
// a mill wheel turning in the harbour beside a timber house
function buildWheelMount(g, v, i) {
  const f = wallFrame(v, i), base = baseY(1);
